<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a0a0a; }
    .primary { fill: #f5f5f5; font-family: Georgia, 'Times New Roman', serif; }
    .secondary { fill: #8a8a8a; font-family: Georgia, 'Times New Roman', serif; }
    .rule { stroke: #14b8a6; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fafafa; }
      .primary { fill: #0a0a0a; }
      .secondary { fill: #555555; }
    }
  </style>
  <rect class="bg" width="900" height="200"/>
  <text x="60" y="95" class="primary" font-size="40" font-weight="bold" letter-spacing="1">ANURAG P.O.</text>
  <text x="60" y="128" class="secondary" font-size="15">Building systems that remove friction between people and computers.</text>
  <line class="rule" x1="60" y1="150" x2="150" y2="150" stroke-width="2"/>
</svg>
